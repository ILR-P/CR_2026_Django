<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Django War Simulator{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 820px; margin: 0 auto; padding: 16px; }
    nav a { margin-right: 14px; }
    .messages { list-style: none; padding: 0; }
    .messages li { padding: 8px 12px; border-radius: 6px; margin-bottom: 6px; background: #eef; }
    .messages li.error { background: #fdd; }
    .messages li.success { background: #dfd; }
    .errorlist { color: #b00; margin: 0; padding-left: 18px; }
    .card { position: relative; display: flex; align-items: center; gap: 12px; padding: 10px;
            border: 1px solid #ccc; border-left-width: 6px; border-radius: 8px; margin-bottom: 8px; }
    .card.blue { border-left-color: #2563eb; }
    .card.red  { border-left-color: #dc2626; }
    .card img, .card .avatar { width: 50px; height: 50px; object-fit: cover; background: #ddd; flex: none; }
    .card .info { flex: 1; }
    .stretched::after { content: ""; position: absolute; inset: 0; }  /* whole card clickable */
    .actions { position: relative; z-index: 2; display: flex; align-items: center; gap: 10px; }
    .actions form { margin: 0; }
    table { border-collapse: collapse; width: 100%; margin: 8px 0; }
    th, td { border: 1px solid #ccc; padding: 4px 8px; text-align: left; }
    .fight { border: 1px solid #ccc; border-radius: 8px; padding: 10px; margin-bottom: 12px; }
    .fight h3 { margin: 0 0 4px; }
  </style>
</head>
<body>
  <nav><a href="{% url 'unit_list' %}">All units</a><a href="{% url 'unit_create' %}">Add unit</a></nav>
  {% if messages %}
    <ul class="messages">{% for m in messages %}<li class="{{ m.tags }}">{{ m }}</li>{% endfor %}</ul>
  {% endif %}
  {% block content %}{% endblock %}
</body>
</html>
